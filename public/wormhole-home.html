<!DOCTYPE html>
<html>
<head>
    <title>Wormhole Extreme Three.js Experiment</title>

    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" id="description" content="An interactive #space scene rendered on the #browser using #WebGL and #ThreeJS by @raintek_" />
    <meta name="author" content="Rainner Lins | @raintek_ | http://rainnerlins.com | https://github.com/rainner" />
    <meta name="copyright" content="&copy; All Rights Reserved - 2016" />

    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">
    <link type="text/css" rel="stylesheet" href="/vendor/wormhole-extreme/dist/css/bundle.min.css" />
    <style>
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

        .icon-amazon:before,
        .icon-apple:before {
            font-family: Arial, sans-serif !important;
            font-weight: 700 !important;
            margin-right: 10px !important;
        }

        .icon-amazon:before {
            content: "a";
            font-size: 1.15em;
        }

        .wormhole-legal-icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            fill: currentColor;
        }

        .icon-apple:before {
            content: "";
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="loader active"></div>

    <div class="stats center animated zoomInDown" style="display: none"></div>

    <div class="container error center fadeIn" style="display: none">
        <span class="error-icon icon-error"></span>
        <h1 class="error-title">Oops, there's a problem.</h1>
        <p class="error-info"></p>
        <button type="button" class="icon-rocket" onclick="top.location.reload( true )">Try again</button>
    </div>

    <div class="container content center animated fadeIn" style="display: none">
        <h1><i>Wormhole Extreme</i></h1>
        <p>An experimental interactive space scene rendered on the browser using WebGL and Three.js with Javascript.</p>
        <button id="hyper-btn" class="btn icon-rocket icon-trim" type="button"><span>Hyper Travel</span></button>
    </div>

    <div class="share center animated zoomInUp" style="display: none">
        <a class="btn icon-twitter icon-trim" data-share="twitter" href="#"><span>Tweet</span></a> &nbsp;
        <a class="btn icon-amazon icon-trim" data-retailer="amazon" href="https://www.amazon.es/" target="_top" rel="noopener noreferrer" aria-label="Amazon" title="Amazon"><span id="wormhole-amazon-label">Amazon</span></a> &nbsp;
        <a class="btn icon-apple icon-trim" data-retailer="apple" href="https://books.apple.com/" target="_top" rel="noopener noreferrer" aria-label="Apple Books" title="Apple Books"><span id="wormhole-apple-label">Apple Books</span></a> &nbsp;
        <a class="btn wormhole-legal-link icon-trim" data-retailer="legal" href="/es/legal/aviso-legal/" target="_top" rel="noopener noreferrer" aria-label="Aviso legal" title="Aviso legal"><svg class="wormhole-legal-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><mask id="legal-document-cutouts"><rect width="24" height="24" fill="white"/><path d="M13 3v5h5M8.5 11h7M8.5 14.5h7M8.5 18h5" fill="black" stroke="black" stroke-width="1.2"/></mask><path d="M5 2h9l5 5v15H5V2z" mask="url(#legal-document-cutouts)"/></svg><span id="wormhole-legal-label">Aviso legal</span></a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r75/three.min.js"></script>
    <script src="/vendor/wormhole-extreme/dist/js/polyfills.js"></script>
    <script src="/vendor/wormhole-extreme/dist/js/bundle.min.js"></script>
    <script src="/vendor/wormhole-extreme/dist/js/app.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var locale = params.get("locale") === "en" ? "en" : "es";
            var retailerLabels = locale === "en"
                ? { amazon: "Amazon", legal: "Legal notice", apple: "Apple Books" }
                : { amazon: "Amazon", legal: "Aviso legal", apple: "Apple Books" };
            var legalPaths = {
                es: "/es/legal/aviso-legal/",
                en: "/en/legal/legal-notice/"
            };
            var links = {
                amazon: document.querySelector('[data-retailer="amazon"]'),
                legal: document.querySelector('[data-retailer="legal"]'),
                apple: document.querySelector('[data-retailer="apple"]')
            };
            var urls = {
                amazon: params.get("amazon") || "https://www.amazon.es/",
                legal: legalPaths[locale],
                apple: params.get("apple") || "https://books.apple.com/"
            };

            Object.keys(links).forEach(function (retailer) {
                var link = links[retailer];
                if (!link) return;
                var label = retailerLabels[retailer];
                link.href = urls[retailer];
                link.setAttribute("aria-label", label);
                link.title = label;
                link.querySelector("span[id]").textContent = label;
            });
        })();
    </script>

</body>
</html>
