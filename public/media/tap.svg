<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .tap-hand {
      animation: tap-hand-press 3.6s ease-in-out infinite;
    }
    .tap-rays {
      animation: tap-rays-flash 3.6s ease-in-out infinite;
    }
    @keyframes tap-hand-press {
      0%, 12%, 26%, 100% { transform: translateY(0); }
      19% { transform: translateY(1.5px); }
    }
    @keyframes tap-rays-flash {
      0%, 12%, 30%, 100% { opacity: 0.42; }
      18%, 22% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tap-hand,
      .tap-rays {
        animation: none;
      }
    }
  </style>
  <path
    class="tap-hand"
    d="M24 40V14a4 4 0 0 1 8 0v17a4 4 0 0 1 8 0v2a4 4 0 0 1 8 0v2a4 4 0 0 1 8 0v8c0 8.3-6.7 15-15 15h-8c-3.8 0-7.4-1.6-9.9-4.4L10.8 39.5a4.1 4.1 0 0 1 6.3-5.3L24 41.5"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    class="tap-rays"
    d="M18 10l-5-3M17 17h-6M22 5l-2-4"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
