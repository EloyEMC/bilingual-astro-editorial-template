<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Editorial book detail preview</title>
  <desc id="desc">A responsive editorial book detail page with a cover, breadcrumb, title, description, and purchase actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2c"/><stop offset="1" stop-color="#03060d"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d19c4d"/><stop offset=".45" stop-color="#325572"/><stop offset="1" stop-color="#101929"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="46" width="1092" height="538" rx="18" fill="#07101c" fill-opacity=".9" stroke="#d8a451" stroke-opacity=".45"/>
  <text x="102" y="100" fill="#d8a451" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">EXAMPLE ASTRO TEMPLATE / ES</text>
  <text x="102" y="140" fill="#b8c5d5" font-family="Arial,sans-serif" font-size="15">Inicio  /  Título de ejemplo</text>
  <rect x="120" y="190" width="260" height="350" rx="6" fill="url(#cover)" stroke="#f4d99b" stroke-width="3"/>
  <circle cx="250" cy="310" r="82" fill="none" stroke="#65e1d0" stroke-opacity=".65" stroke-width="3"/>
  <text x="250" y="390" fill="#fff7e6" font-family="Georgia,serif" font-size="31" text-anchor="middle">TÍTULO</text>
  <text x="250" y="427" fill="#f4d99b" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">DE EJEMPLO</text>
  <text x="500" y="240" fill="#f4d99b" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">NOVELA / ENSAYO</text>
  <text x="500" y="305" fill="#fff7e6" font-family="Georgia,serif" font-size="58">Título de ejemplo</text>
  <text x="500" y="352" fill="#c9d7e7" font-family="Arial,sans-serif" font-size="20">Una página de detalle editorial clara,</text>
  <text x="500" y="383" fill="#c9d7e7" font-family="Arial,sans-serif" font-size="20">responsive y lista para personalizar.</text>
  <rect x="500" y="435" width="150" height="44" rx="4" fill="#d8a451"/>
  <text x="575" y="463" fill="#07101c" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">DESCUBRIR</text>
  <rect x="670" y="435" width="150" height="44" rx="4" fill="none" stroke="#d8a451"/>
  <text x="745" y="463" fill="#f4d99b" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">DETALLES</text>
</svg>
