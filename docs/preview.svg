<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bilingual Astro editorial template preview</title>
  <desc id="desc">A dark editorial landing page with a glowing space background, bilingual navigation, a book cover, and a call to action.</desc>
  <defs>
    <radialGradient id="bg" cx="58%" cy="42%" r="78%">
      <stop offset="0" stop-color="#203b61"/>
      <stop offset="0.46" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop stop-color="#f7d58d"/><stop offset="1" stop-color="#b97731"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="830" cy="260" r="170" fill="none" stroke="#54d8c4" stroke-opacity=".25" stroke-width="3" filter="url(#glow)"/>
  <circle cx="830" cy="260" r="170" fill="none" stroke="#65e1d0" stroke-opacity=".7" stroke-width="2"/>
  <g fill="#b7f5ec" opacity=".8">
    <circle cx="92" cy="108" r="2"/><circle cx="184" cy="274" r="3"/><circle cx="334" cy="80" r="2"/><circle cx="1035" cy="112" r="2"/><circle cx="1080" cy="395" r="3"/><circle cx="945" cy="530" r="2"/><circle cx="505" cy="510" r="2"/>
  </g>
  <rect x="74" y="62" width="1052" height="506" rx="20" fill="#050b15" fill-opacity=".62" stroke="#d8a451" stroke-opacity=".35"/>
  <text x="110" y="112" fill="#f0d39a" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">EXAMPLE ASTRO TEMPLATE</text>
  <text x="110" y="190" fill="#fff7e6" font-family="Georgia,serif" font-size="56">Your next story</text>
  <text x="110" y="240" fill="#d5e0eb" font-family="Arial,sans-serif" font-size="21">A bilingual editorial landing page, ready to shape.</text>
  <rect x="110" y="292" width="155" height="46" rx="4" fill="url(#gold)"/>
  <text x="187" y="321" fill="#07101d" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">EXPLORE THE BOOK</text>
  <rect x="790" y="145" width="190" height="282" rx="5" fill="#172c46" stroke="#f0d39a" stroke-width="3" transform="rotate(6 885 286)"/>
  <path d="M815 250 Q885 180 955 250" fill="none" stroke="#63dfcf" stroke-width="4" opacity=".8"/>
  <text x="885" y="315" fill="#f4d796" font-family="Georgia,serif" font-size="26" text-anchor="middle" transform="rotate(6 885 315)">YOUR</text>
  <text x="885" y="350" fill="#fff7e6" font-family="Georgia,serif" font-size="26" text-anchor="middle" transform="rotate(6 885 350)">STORY</text>
  <text x="1070" y="520" fill="#d5e0eb" font-family="Arial,sans-serif" font-size="14" text-anchor="end">ES / EN</text>
</svg>
